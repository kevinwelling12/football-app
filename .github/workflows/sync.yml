name: Sync from ESPN
# Four times a day (UTC): after the European day, before and after the US evening, and overnight.
# Refetches current seasons, reruns the ratings, republishes web/data, then redeploys the page
# (pushes made with the workflow token don't trigger pages.yml on their own).
on:
  schedule:
    - cron: '17 4 * * *'
    - cron: '17 10 * * *'
    - cron: '17 16 * * *'
    - cron: '17 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: node scripts/sync.mjs --report sync-report.md
      - run: python3 scripts/logos.py
      - if: always()
        run: '[ -f sync-report.md ] && cat sync-report.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add history web/data web/logos
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git config user.name "espn-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "ESPN sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
